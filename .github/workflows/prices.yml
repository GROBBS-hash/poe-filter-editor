name: Price cache

# Fetches poe.ninja prices once an hour for every user of the app, and
# publishes them on the "prices" branch. The app reads those files instead
# of calling poe.ninja from each player's PC (as poe.ninja asks).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/fetch_prices.py", ".github/workflows/prices.yml"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python tools/fetch_prices.py out
      - name: Publish to the prices branch
        run: |
          cd out
          git init -q -b prices
          git config user.name "price-cache"
          git config user.email "price-cache@users.noreply.github.com"
          git add -A
          git commit -q -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prices
