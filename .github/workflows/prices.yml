name: Price cache

# Fetches poe.ninja prices once an hour for every user of the app, and
# publishes them on the "prices" branch. The app reads those files instead
# of calling poe.ninja from each player's PC (as poe.ninja asks).
on:
  schedule:
    # GitHub drops most scheduled runs (25 Nov: two or three a day got through), so it asks more often; a run within
    # 50 minutes of the last prices fetches nothing, so poe.ninja is still asked at most once an hour.
    - cron: "3,13,23,33,43,53 * * * *"
  # The owner's editor asks while it is open (src-tauri/src/price_tick.rs); tick "force" to fetch anyway.
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tools/fetch_prices.py", ".github/workflows/prices.yml"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Are the prices due?
        id: due
        run: |
          due=yes
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.force }}" != "true" ]; then
            at=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/prices/poe1.json" | head -c 400 | grep -o '"updated":"[^"]*"' | cut -d'"' -f4 || true)
            if [ -n "$at" ] && [ $(( $(date -u +%s) - $(date -u -d "$at" +%s) )) -lt 3000 ]; then due=no; fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'yes'
        with:
          python-version: "3.12"
      - name: Fetch prices
        if: steps.due.outputs.due == 'yes'
        run: python tools/fetch_prices.py out
      - name: Publish to the prices branch
        if: steps.due.outputs.due == 'yes'
        run: |
          cd out
          git init -q -b prices
          git config user.name "price-cache"
          git config user.email "price-cache@users.noreply.github.com"
          git add -A
          git commit -q -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prices
