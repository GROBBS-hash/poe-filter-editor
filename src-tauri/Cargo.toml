[package]
name = "poe-filter-editor"
version = "0.2.85"
edition = "2021"

[lib]
name = "poe_filter_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filter-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
enigo = "0.5"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr",
  "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation",
] }
